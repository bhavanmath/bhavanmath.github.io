<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Loading</title>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            background: #000;
        }

        #loading-screen {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            padding:
                max(var(--padding), env(safe-area-inset-top))
                max(var(--padding), env(safe-area-inset-right))
                max(var(--padding), env(safe-area-inset-bottom))
                max(var(--padding), env(safe-area-inset-left));

            display: grid;

            grid-template-columns:
                repeat(var(--cols), minmax(0, 1fr));

            grid-template-rows:
                repeat(var(--rows), minmax(0, 1fr));

            gap: var(--gap);

            overflow: hidden;

            background: #000;
        }

        .bit {
            min-width: 0;
            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "IBM Plex Mono", monospace;
            font-size: clamp(9px, 1.1vw, 18px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.02em;

            color: #8f8f8f;

            user-select: none;
            white-space: nowrap;
            overflow: hidden;

            transform: scale(1);

            transition:
                color 180ms ease,
                opacity 180ms ease,
                transform 180ms ease,
                text-shadow 180ms ease;
        }

        /*
         * Normal illuminated 1
         */
        .bit.one {
            color: #ffffff;

            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.25);
        }

        /*
         * Moment when a bit is changing
         */
        .bit.changing {
            opacity: 0.35;
            transform: scale(0.75);

            text-shadow: none;
        }

        /*
         * Bright flash when 0 becomes 1
         */
        .bit.illuminate {
            color: #ffffff;

            transform: scale(1.22);

            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.9),
                0 0 10px rgba(255, 255, 255, 0.65),
                0 0 20px rgba(255, 255, 255, 0.35);

            animation: illuminate 320ms ease-out forwards;
        }

        @keyframes illuminate {
            0% {
                color: #ffffff;
                transform: scale(0.75);

                text-shadow:
                    0 0 3px rgba(255, 255, 255, 1),
                    0 0 12px rgba(255, 255, 255, 0.9),
                    0 0 28px rgba(255, 255, 255, 0.7);
            }

            35% {
                color: #ffffff;
                transform: scale(1.28);

                text-shadow:
                    0 0 5px rgba(255, 255, 255, 1),
                    0 0 16px rgba(255, 255, 255, 0.9),
                    0 0 30px rgba(255, 255, 255, 0.65);
            }

            100% {
                color: #ffffff;
                transform: scale(1);

                text-shadow:
                    0 0 4px rgba(255, 255, 255, 0.25);
            }
        }
    </style>
</head>

<body>

    <div id="loading-screen"></div>

    <script>
        const screen = document.getElementById("loading-screen");

        let bits = [];

        /*
         * Calculate the grid so it always fits
         * inside the viewport without scrolling.
         */
        function getViewportSize() {
            if (window.visualViewport) {
                return {
                    width: window.visualViewport.width,
                    height: window.visualViewport.height
                };
            }

            return {
                width: window.innerWidth,
                height: window.innerHeight
            };
        }


        function createGrid() {
            const { width, height } = getViewportSize();

            const padding =
                Math.min(
                    Math.max(width * 0.04, 20),
                    60
                );

            const gap =
                Math.min(
                    Math.max(width * 0.012, 6),
                    20
                );

            const targetCellWidth = 30;
            const targetCellHeight = 30;

            const availableWidth =
                width - padding * 2;

            const availableHeight =
                height - padding * 2;

            const cols =
                Math.max(
                    1,
                    Math.floor(
                        (availableWidth + gap) /
                        (targetCellWidth + gap)
                    )
                );

            const rows =
                Math.max(
                    1,
                    Math.floor(
                        (availableHeight + gap) /
                        (targetCellHeight + gap)
                    )
                );

            screen.style.setProperty(
                "--cols",
                cols
            );

            screen.style.setProperty(
                "--rows",
                rows
            );

            screen.style.setProperty(
                "--padding",
                `${padding}px`
            );

            screen.style.setProperty(
                "--gap",
                `${gap}px`
            );


            screen.innerHTML = "";

            bits = [];

            const total = rows * cols;

            for (let i = 0; i < total; i++) {

                const bit = document.createElement("div");

                bit.className = "bit";

                bit.textContent = "0";

                screen.appendChild(bit);

                bits.push(bit);
            }
        }


        /*
         * Change a bit.
         */
        function changeBit(bit, value, illuminate = false) {

            bit.classList.add("changing");

            setTimeout(() => {

                bit.textContent = value;

                bit.classList.remove("changing");

                if (value === "1") {

                    bit.classList.add("one");

                    /*
                     * Trigger illumination effect.
                     */
                    if (illuminate) {

                        bit.classList.remove("illuminate");

                        /*
                         * Force animation restart.
                         */
                        void bit.offsetWidth;

                        bit.classList.add("illuminate");

                        setTimeout(() => {
                            bit.classList.remove("illuminate");
                        }, 350);
                    }

                } else {

                    bit.classList.remove("one");
                    bit.classList.remove("illuminate");
                }

            }, 45);
        }


        /*
         * Randomly change bits.
         */
        function randomizeBits(
            collection,
            amount,
            illuminateOnes = false
        ) {

            const shuffled = [...collection];

            /*
             * Fisher-Yates shuffle
             */
            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    shuffled[i],
                    shuffled[j]
                ] = [
                    shuffled[j],
                    shuffled[i]
                ];
            }


            const selected =
                shuffled.slice(
                    0,
                    Math.min(amount, shuffled.length)
                );


            selected.forEach(bit => {

                const newValue =
                    bit.textContent === "0"
                        ? "1"
                        : "0";

                changeBit(
                    bit,
                    newValue,
                    newValue === "1" &&
                    illuminateOnes
                );

            });
        }


        /*
         * Turn a portion of the remaining
         * zeroes into illuminated ones.
         */
        function convertRemainingZeros() {

            const zeros =
                bits.filter(
                    bit => bit.textContent === "0"
                );

            /*
             * Shuffle zeros.
             */
            for (
                let i = zeros.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    zeros[i],
                    zeros[j]
                ] = [
                    zeros[j],
                    zeros[i]
                ];
            }


            const amount =
                Math.ceil(
                    zeros.length * 0.40
                );


            zeros
                .slice(0, amount)
                .forEach((bit, index) => {

                    setTimeout(() => {

                        changeBit(
                            bit,
                            "1",
                            true
                        );

                    }, Math.random() * 250);

                });
        }


        /*
         * Final wave:
         * remaining zeroes become illuminated 1s.
         */
        function finalWave() {

            const zeros =
                bits.filter(
                    bit => bit.textContent === "0"
                );


            zeros.forEach(bit => {

                const delay =
                    Math.random() * 180;

                setTimeout(() => {

                    changeBit(
                        bit,
                        "1",
                        true
                    );

                }, delay);

            });
        }


        /*
         * START
         */

        createGrid();


        /*
         * Initial scattered illumination
         */
        setTimeout(() => {

            randomizeBits(
                bits,
                Math.max(4, Math.floor(bits.length * 0.10)),
                true
            );

        }, 250);


        /*
         * Second wave
         *
         * Some 1s become 0s and some 0s
         * become illuminated 1s.
         */
        setTimeout(() => {

            randomizeBits(
                bits,
                Math.max(5, Math.floor(bits.length * 0.15)),
                true
            );

        }, 600);


        /*
         * Third wave
         */
        setTimeout(() => {

            randomizeBits(
                bits,
                Math.max(5, Math.floor(bits.length * 0.12)),
                true
            );

        }, 950);


        /*
         * Larger transition
         */
        setTimeout(() => {

            convertRemainingZeros();

        }, 1300);


        /*
         * Final illumination wave
         */
        setTimeout(() => {

            finalWave();

        }, 1750);


        /*
         * At approximately 2 seconds,
         * transition to your actual website.
         *
         * Example:
         *
         * window.location.href = "home.html";
         *
         * or:
         *
         * document.getElementById("loading-screen").remove();
         */

        setTimeout(() => {

            // Your website transition goes here.

        }, 2100);


        /*
         * Rebuild on orientation / viewport change.
         */
        let resizeTimeout;

        function handleResize() {

            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {

                createGrid();

            }, 100);

        }


        window.addEventListener(
            "resize",
            handleResize
        );

        window.addEventListener(
            "orientationchange",
            handleResize
        );

        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                handleResize
            );

        }

    </script>

</body>
</html>
