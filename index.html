<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Loading</title>


    <!-- ==========================================
         COMPUTERIZED FONT
         ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           GLOBAL RESET
           ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000000;
        }


        /* =========================================
           LOADING SCREEN
           ========================================= */

        #loading-screen {

            width: 100%;
            height: 100vh;
            height: 100dvh;


            /*
             * Safe-area support for phones with
             * notches and rounded corners.
             */

            padding-top:
                max(20px, env(safe-area-inset-top));

            padding-right:
                max(20px, env(safe-area-inset-right));

            padding-bottom:
                max(20px, env(safe-area-inset-bottom));

            padding-left:
                max(20px, env(safe-area-inset-left));


            /*
             * Grid dimensions are calculated
             * dynamically using JavaScript.
             */

            display: grid;

            grid-template-columns:
                repeat(
                    var(--cols),
                    minmax(0, 1fr)
                );

            grid-template-rows:
                repeat(
                    var(--rows),
                    minmax(0, 1fr)
                );


            gap: var(--gap);


            /*
             * Prevent the grid from ever
             * overflowing the viewport.
             */

            min-width: 0;
            min-height: 0;

            overflow: hidden;

            background: #000000;
        }


        /* =========================================
           BINARY CHARACTERS
           ========================================= */

        .bit {

            min-width: 0;
            min-height: 0;


            display: flex;

            align-items: center;
            justify-content: center;


            /*
             * ZEROES
             *
             * Soft gray.
             */

            color: #8f8f8f;


            /*
             * Computerized / technical font.
             */

            font-family:
                "IBM Plex Mono",
                monospace;


            font-size:
                clamp(
                    9px,
                    1.1vw,
                    18px
                );


            font-weight: 400;

            line-height: 1;

            letter-spacing: 0.02em;


            user-select: none;

            white-space: nowrap;

            overflow: hidden;


            /*
             * Smooth visual transition.
             */

            transition:
                color 120ms ease-out,
                opacity 120ms ease-out,
                transform 120ms ease-out;
        }


        /* =========================================
           ACTIVE 1s
           ========================================= */

        .bit.one {

            /*
             * Bright white.
             */

            color: #ffffff;
        }


        /* =========================================
           BIT TRANSITION
           ========================================= */

        .bit.changing {

            /*
             * Briefly dim and shrink the
             * character while it changes.
             */

            opacity: 0.45;

            transform: scale(0.82);
        }

    </style>

</head>


<body>


    <!-- ==========================================
         LOADING GRID
         ========================================== -->

    <div id="loading-screen"></div>


    <script>


        /* =========================================
           ELEMENT
           ========================================= */

        const screen =
            document.getElementById(
                "loading-screen"
            );


        /* =========================================
           CONFIGURATION
           ========================================= */

        const TOTAL_TIME = 2000;


        /*
         * Desired approximate size of each cell.
         *
         * These values are only used to calculate
         * how many cells fit on the screen.
         */

        const TARGET_CELL_WIDTH = 30;

        const TARGET_CELL_HEIGHT = 30;


        /* =========================================
           GET VIEWPORT SIZE
           ========================================= */

        function getViewport() {

            /*
             * visualViewport gives more accurate
             * dimensions on mobile browsers.
             */

            if (window.visualViewport) {

                return {

                    width:
                        window.visualViewport.width,

                    height:
                        window.visualViewport.height

                };
            }


            return {

                width:
                    window.innerWidth,

                height:
                    window.innerHeight

            };
        }


        /* =========================================
           CALCULATE GRID DIMENSIONS
           ========================================= */

        function calculateGrid() {

            const viewport =
                getViewport();


            const width =
                viewport.width;

            const height =
                viewport.height;


            /*
             * Responsive edge padding.
             */

            const padding =
                Math.min(
                    Math.max(
                        width * 0.04,
                        20
                    ),
                    60
                );


            /*
             * Responsive space between
             * characters.
             */

            const gap =
                Math.min(
                    Math.max(
                        width * 0.012,
                        6
                    ),
                    20
                );


            /*
             * Available screen area.
             */

            const availableWidth =
                Math.max(
                    1,
                    width -
                    padding * 2
                );


            const availableHeight =
                Math.max(
                    1,
                    height -
                    padding * 2
                );


            /*
             * Calculate number of columns.
             */

            const cols =
                Math.max(
                    1,
                    Math.floor(
                        (
                            availableWidth +
                            gap
                        ) /
                        (
                            TARGET_CELL_WIDTH +
                            gap
                        )
                    )
                );


            /*
             * Calculate number of rows.
             */

            const rows =
                Math.max(
                    1,
                    Math.floor(
                        (
                            availableHeight +
                            gap
                        ) /
                        (
                            TARGET_CELL_HEIGHT +
                            gap
                        )
                    )
                );


            return {

                rows,
                cols,
                padding,
                gap

            };
        }


        /* =========================================
           CREATE GRID
           ========================================= */

        function createGrid() {

            const {

                rows,
                cols,
                padding,
                gap

            } = calculateGrid();


            /*
             * Clear previous grid.
             */

            screen.innerHTML = "";


            /*
             * Set CSS variables.
             */

            screen.style.setProperty(
                "--rows",
                rows
            );


            screen.style.setProperty(
                "--cols",
                cols
            );


            screen.style.setProperty(
                "--gap",
                `${gap}px`
            );


            screen.style.padding =
                `${padding}px`;


            /*
             * Total number of cells.
             */

            const totalCells =
                rows * cols;


            /*
             * Create cells.
             *
             * EVERY CELL STARTS AS 0.
             */

            for (
                let i = 0;
                i < totalCells;
                i++
            ) {

                const bit =
                    document.createElement(
                        "div"
                    );


                bit.className =
                    "bit";


                bit.textContent =
                    "0";


                screen.appendChild(
                    bit
                );
            }
        }


        /* =========================================
           CHANGE ONE BIT
           ========================================= */

        function changeBit(
            bit,
            value
        ) {

            /*
             * Begin subtle transition.
             */

            bit.classList.add(
                "changing"
            );


            setTimeout(
                () => {


                    /*
                     * Change the actual
                     * character.
                     */

                    bit.textContent =
                        value;


                    /*
                     * 0 = gray
                     *
                     * 1 = bright white
                     */

                    if (
                        value === "1"
                    ) {

                        bit.classList.add(
                            "one"
                        );

                    }

                    else {

                        bit.classList.remove(
                            "one"
                        );
                    }


                    /*
                     * Allow browser to render
                     * the new state before
                     * removing transition.
                     */

                    requestAnimationFrame(
                        () => {

                            bit.classList.remove(
                                "changing"
                            );

                        }
                    );


                },
                45
            );
        }


        /* =========================================
           RANDOM BIT CHANGES
           ========================================= */

        function randomizeBits(
            bits,
            amount
        ) {


            const indices = [];


            /*
             * Create list of indices.
             */

            for (
                let i = 0;
                i < bits.length;
                i++
            ) {

                indices.push(i);
            }


            /*
             * Fisher-Yates shuffle.
             */

            for (
                let i =
                    indices.length - 1;

                i > 0;

                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    indices[i],
                    indices[j]

                ] = [

                    indices[j],
                    indices[i]

                ];
            }


            /*
             * Flip selected cells.
             */

            for (
                let i = 0;

                i < amount &&
                i < indices.length;

                i++
            ) {


                const bit =
                    bits[
                        indices[i]
                    ];


                /*
                 * 0 → 1
                 *
                 * 1 → 0
                 */

                const newValue =
                    bit.textContent === "0"
                        ? "1"
                        : "0";


                changeBit(
                    bit,
                    newValue
                );
            }
        }


        /* =========================================
           START LOADING ANIMATION
           ========================================= */

        function startLoading() {


            /*
             * Build grid.
             */

            createGrid();


            /*
             * Get all binary cells.
             */

            const bits =
                Array.from(
                    document.querySelectorAll(
                        ".bit"
                    )
                );


            /*
             * =====================================
             * 0 ms
             *
             * ALL ZEROES
             *
             * Gray.
             * =====================================
             */


            /*
             * =====================================
             * 250 ms
             *
             * FIRST FEW 1s
             *
             * They become bright white.
             * =====================================
             */

            setTimeout(
                () => {

                    randomizeBits(
                        bits,
                        Math.max(
                            4,
                            Math.floor(
                                bits.length *
                                0.10
                            )
                        )
                    );

                },
                250
            );


            /*
             * =====================================
             * 600 ms
             *
             * MORE 1s
             * =====================================
             */

            setTimeout(
                () => {

                    randomizeBits(
                        bits,
                        Math.max(
                            5,
                            Math.floor(
                                bits.length *
                                0.15
                            )
                        )
                    );

                },
                600
            );


            /*
             * =====================================
             * 950 ms
             *
             * MIXED ACTIVITY
             *
             * Some 1 → 0
             * Some 0 → 1
             *
             * Prevents the animation from looking
             * like a simple percentage counter.
             * =====================================
             */

            setTimeout(
                () => {

                    randomizeBits(
                        bits,
                        Math.max(
                            5,
                            Math.floor(
                                bits.length *
                                0.12
                            )
                        )
                    );

                },
                950
            );


            /*
             * =====================================
             * 1300 ms
             *
             * Increase number of bright 1s.
             * =====================================
             */

            setTimeout(
                () => {


                    /*
                     * Find all remaining zeroes.
                     */

                    const zeroBits =
                        bits.filter(
                            bit =>
                                bit.textContent ===
                                "0"
                        );


                    /*
                     * Shuffle zeroes.
                     */

                    for (
                        let i =
                            zeroBits.length - 1;

                        i > 0;

                        i--
                    ) {

                        const j =
                            Math.floor(
                                Math.random() *
                                (i + 1)
                            );


                        [
                            zeroBits[i],
                            zeroBits[j]

                        ] = [

                            zeroBits[j],
                            zeroBits[i]

                        ];
                    }


                    /*
                     * Convert roughly 40% of
                     * remaining zeroes into 1s.
                     */

                    const amount =
                        Math.max(
                            1,
                            Math.floor(
                                zeroBits.length *
                                0.40
                            )
                        );


                    for (
                        let i = 0;
                        i < amount;
                        i++
                    ) {

                        changeBit(
                            zeroBits[i],
                            "1"
                        );
                    }

                },
                1300
            );


            /*
             * =====================================
             * 1750 ms
             *
             * FINAL TRANSITION
             *
             * Everything becomes bright white.
             * =====================================
             */

            setTimeout(
                () => {


                    bits.forEach(
                        bit => {


                            /*
                             * Slightly random delay
                             * for organic movement.
                             */

                            const delay =
                                Math.random() *
                                180;


                            setTimeout(
                                () => {


                                    if (
                                        bit.textContent
                                        !== "1"
                                    ) {

                                        changeBit(
                                            bit,
                                            "1"
                                        );
                                    }

                                },
                                delay
                            );

                        }
                    );

                },
                1750
            );


            /*
             * =====================================
             * 2000 ms
             *
             * LOADING COMPLETE
             * =====================================
             */

            setTimeout(
                () => {


                    /*
                     * Your actual website can
                     * start here.
                     *
                     * Example:
                     *
                     * window.location.href =
                     *     "home.html";
                     */

                },
                TOTAL_TIME
            );
        }


        /* =========================================
           INITIALIZE
           ========================================= */

        startLoading();


        /* =========================================
           RESPONSIVE RESIZING
           ========================================= */

        let resizeTimer;


        function handleResize() {


            clearTimeout(
                resizeTimer
            );


            resizeTimer =
                setTimeout(
                    () => {

                        /*
                         * Recalculate the grid
                         * whenever the viewport changes.
                         */

                        createGrid();

                    },
                    100
                );
        }


        /*
         * Desktop resize.
         */

        window.addEventListener(
            "resize",
            handleResize
        );


        /*
         * Mobile browser viewport resize
         * and orientation changes.
         */

        if (
            window.visualViewport
        ) {

            window.visualViewport.addEventListener(
                "resize",
                handleResize
            );
        }

    </script>

</body>

</html>
